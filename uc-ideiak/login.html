<!doctype html>
<html class="h-full" lang="es" style="background-color: #0d0d0d;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/UC_logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UC Ideiak | Acceso </title>
  <script defer type="module" src="/src/main.ts"></script>
</head>

<body class="min-h-screen bg-background text-white selection:bg-primary selection:text-background flex flex-col">

  <nav class="container mx-auto px-6 py-10 flex justify-between items-center">
    <a href="/" class="flex items-center group">
      <img
        class="h-24 md:h-32 lg:h-40 w-auto drop-shadow-[0_0_20px_rgba(191,245,73,0.2)] group-hover:scale-105 transition-all duration-500"
        src="/src/assets/UC_brand.png" alt="Logo de UC Ideiak">
    </a>
  </nav>

  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-lg">
      <div class="glass-card shadow-2xl">
        <div class="mb-10 text-center">
          <h2 class="text-3xl font-bold tracking-tight text-white uppercase italic">Acceso <span class="text-primary">Partner</span></h2>
          <p class="mt-2 text-sm text-white/50 tracking-widest uppercase">Introduce tus credenciales</p>
        </div>

        <form class="space-y-6">
          <div class="space-y-2">
            <label for="email" class="block text-xs font-bold text-white/60 uppercase tracking-widest ml-1">Correo electrónico</label>
            <input id="email" type="email" name="email" required autocomplete="email"
              class="block w-full rounded-lg bg-white/5 border border-white/10 px-4 py-3 text-white placeholder:text-white/20 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"
              placeholder="usuario@ucideiak.com" />
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between ml-1">
              <label for="password" class="block text-xs font-bold text-white/60 uppercase tracking-widest">Contraseña</label>
            </div>
            <input id="password" type="password" name="password" required autocomplete="current-password"
              class="block w-full rounded-lg bg-white/5 border border-white/10 px-4 py-3 text-white placeholder:text-white/20 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"
              placeholder="••••••••" />
          </div>

          <div class="pt-4">
            <a href="/no_login.html" role="button" class="btn-primary w-full py-4 text-base tracking-widest">
              <span>ENTRAR</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>
          </div>

          <div class="text-center pt-2">
            <a href="#" class="text-[10px] font-bold text-white/30 hover:text-primary transition-colors uppercase tracking-[0.2em]">¿Problemas con el acceso? Contactar soporte</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-8 border-t border-white/10">
    <div class="container mx-auto px-6 text-center">
      <p class="text-xs opacity-30 uppercase tracking-[0.3em]">
        © 2023 UC Ideiak. Sistema de Seguridad Encriptado.
      </p>
    </div>
  </footer>
</body>

</html>
